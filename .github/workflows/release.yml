name: release

# Every push and PR runs the guard. Pushing a v* tag also packs the package and
# attaches the tarball to a GitHub release; consumers depend on that tarball
# URL, and their brand-sync workflow picks up the newest release on its own.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }

      - name: Pack and release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          gh release create "$GITHUB_REF_NAME" skylimit-brand-*.tgz --generate-notes --title "$GITHUB_REF_NAME"
